name: Collector CI

on:
  pull_request:
    paths:
      - 'services/collector/**'
      - '.github/workflows/collector-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/collector/**'
      - '.github/workflows/collector-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/collector/requirements.txt
      - run: pip install -r services/collector/requirements.txt
      - name: Compile
        run: python -m py_compile services/collector/collector.py services/collector/email_notifier.py
      - name: Tests
        working-directory: services/collector
        run: python -m unittest discover -p 'test_*.py' -v
